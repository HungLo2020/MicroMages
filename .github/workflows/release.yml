name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libsdl2-dev python3-pil xvfb xdotool openbox
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Validate source and assets
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python3 -m unittest discover -s scripts
      - name: Build Linux x64
        run: cargo build --locked --release
      - name: Package and verify the shipped ZIP
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 scripts/package_linux.py --revision "$REVISION"
          python3 scripts/verify_package.py dist/MicroMages-latest-linux-x64.zip
          python3 scripts/verify_audio.py dist/MicroMages-latest-linux-x64.zip
          xvfb-run -a python3 scripts/verify_desktop.py dist/MicroMages-latest-linux-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: rolling-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x64
          path: dist
      - name: Replace rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish_latest.py
