[package]
name = "micro-mages-re"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
rodio = "0.20.1"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
