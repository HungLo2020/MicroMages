[package]
name = "micro-mages-re"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = [
    "dep:quasar-render-2d",
    "dep:quasar-window",
    "quasar-render-2d/gpu",
    "quasar-render-2d/vulkan",
]

[dependencies]
gilrs = "0.11"
quasar-audio = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", default-features = false, features = ["native"] }
quasar-core = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5" }
quasar-input = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5" }
quasar-render-2d = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", default-features = false, features = ["gpu", "png", "vulkan"], optional = true }
quasar-storage = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5" }
quasar-window = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
