[package]
name = "micro-mages-re"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
minifb = "0.28"
rodio = "0.20.1"
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
x11-dl = "2.21"

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
